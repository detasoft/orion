server {
    listen 80;
    server_name orion.test;
    location /.well-known/acme-challenge/ {
        proxy_pass http://host.docker.internal:8000;
        proxy_set_header Host orion.test;
    }
    location / { return 404; }
}
server {
    listen 8443 ssl;
    server_name fixture.orion.test;
    ssl_certificate /state/tls/fixture.crt;
    ssl_certificate_key /state/tls/fixture.key;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host fixture.orion.test:8443;
        proxy_set_header X-Forwarded-Proto https;
    }
}
server {
    listen 8333 ssl;
    server_name fixture.orion.test;
    ssl_certificate /state/tls/fixture.crt;
    ssl_certificate_key /state/tls/fixture.key;
    client_max_body_size 100m;
    location / { proxy_pass http://127.0.0.1:8334; proxy_set_header Host $http_host; }
}
server {
    listen 9223;
    location / {
        proxy_pass http://127.0.0.1:9222;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:9222;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

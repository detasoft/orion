[bootstrap]
baseDir = "orion_root"
workDir = "work"
threadPoolSize = 10

[bootstrap.accessControl]
location = "local:orion"
ref = "refs/heads/main"
paths = ["orion.xml"]
createDefaultIfMissing = true

[bootstrap.keyMaterial]
location = "local:orion"
ref = "refs/heads/main"
path = "material.p12"
password = "env:ORION_KEY_MATERIAL_PASSWORD"
createIfMissing = false
clusterId = "orion"

[bootstrap.keyMaterial.serverSigning]
algorithm = "RSA"
verification = []

[bootstrap.keyMaterial.serverSigning.active]
alias = "server-signing-v1"
version = 1

[storage]
location = "repos"
createOnPush = true

[transport]
defaultAddress = "localhost"

[transport.git]
port = 9419
enabled = true

[transport.http]
port = 8000

[transport.https]
port = 8443

[transport.https.acme]
enabled = false
directoryUrl = "acme://letsencrypt.org/staging"
accountKeyPath = "acme/account.keypair"
domainKeyPath = "acme/domain.keypair"
certificatePath = "acme/nginx.pem"

[transport.ssh]
port = 8022

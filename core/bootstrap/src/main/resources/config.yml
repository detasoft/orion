bootstrap:
  baseDir: orion_root
  workDir: work
  threadPoolSize: 10
  accessControl:
    location: local:orion
    ref: refs/heads/main
    paths:
      - orion.xml
    createDefaultIfMissing: true
  keyMaterial:
    location: key-material/orion.p12
    password: env:ORION_KEY_MATERIAL_PASSWORD
    createIfMissing: true
    clusterId: orion
    serverSigning:
      algorithm: RSA
      active:
        alias: server-signing-v1
        version: 1
      verification: []
storage:
  location: repos
  createOnPush: true
transport:
  defaultAddress: localhost
  git:
    port: 9419
    enabled: true
  http:
    port: 8000
  https:
    port: 8443
    acme:
      enabled: false
      directoryUrl: acme://letsencrypt.org/staging
      accountKeyPath: acme/account.keypair
      domainKeyPath: acme/domain.keypair
      certificatePath: acme/nginx.pem
  ssh:
    port: 8022

bootstrap:
  baseDir: orion_root
  workDir: work
  threadPoolSize: 10
  accessControl:
    location: local:orion
    ref: refs/heads/main
    paths:
      - orion.xml
    createDefaultIfMissing: true
  keyMaterial:
    location: local:orion
    ref: refs/heads/main
    path: material.p12
    password: env:ORION_KEY_MATERIAL_PASSWORD
    clusterId: orion
    serverSigning:
      algorithm: RSA
      active:
        alias: server-signing-v1
        version: 1
      verification: []
storage:
  location: repos
  createOnPush: true
transport:
  defaultAddress: localhost
  git:
    port: 9419
    enabled: true
  http:
    port: 8000
  ssh:
    port: 8022
